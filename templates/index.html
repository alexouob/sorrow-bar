<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解憂吧台 | AI 專屬情緒特調師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f1115;
            background-image: radial-gradient(circle at 50% 0%, #2a2d34 0%, #0f1115 70%);
            color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 調酒搖晃動畫 */
        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-5deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(5deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(5deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-5deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-5deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(5deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-5deg);
            }
        }

        .shaking {
            animation: shake 0.5s;
            animation-iteration-count: infinite;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-3xl w-full text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-bold tracking-wider text-amber-500 mb-2">解憂吧台</h1>
        <p class="text-gray-400">The Sorrow-Relieving Bar</p>
    </div>

    <!-- 輸入區塊 -->
    <div id="input-section" class="max-w-2xl w-full glass-panel p-8 rounded-2xl shadow-2xl transition-all duration-500">
        <label for="mood-input" class="block text-lg mb-4 text-gray-300">今天過得好嗎？跟調酒師說說吧...</label>
        <textarea id="mood-input" rows="4"
            class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-gray-200 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors resize-none"
            placeholder="例如：專題跑不出結果，覺得有點焦慮..."></textarea>

        <button id="mix-btn" onclick="orderCocktail()"
            class="w-full mt-6 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded-xl transition-colors flex justify-center items-center gap-2">
            <span>🍸</span> 給我一杯特調
        </button>
    </div>

    <!-- 載入中動畫區塊 -->
    <div id="loading-section" class="hidden flex-col items-center justify-center py-12">
        <div class="text-6xl mb-4 shaking">🍹</div>
        <p class="text-amber-500 text-lg font-medium animate-pulse">調酒師正在為您調製專屬配方...</p>
        <p class="text-gray-500 text-sm mt-2">（根據情緒解析酒譜並生成特調中，約需 10-15 秒）</p>
    </div>

    <!-- 結果區塊 -->
    <div id="result-section"
        class="hidden max-w-4xl w-full mt-8 grid grid-cols-1 md:grid-cols-2 gap-8 glass-panel p-8 rounded-2xl shadow-2xl transition-opacity duration-1000 opacity-0">
        <!-- 圖片區 -->
        <div class="flex justify-center items-center">
            <img id="cocktail-image" src="" alt="專屬特調"
                class="rounded-xl shadow-lg border border-gray-700 w-full object-cover aspect-square">
        </div>

        <!-- 文字區 -->
        <div class="flex flex-col justify-center space-y-6">
            <div>
                <h2 id="cocktail-name" class="text-3xl font-bold text-amber-400 mb-1"></h2>
                <div class="h-1 w-16 bg-amber-600 rounded"></div>
            </div>

            <div>
                <h3 class="text-gray-400 text-sm font-semibold tracking-wider mb-2">配方 INGREDIENTS</h3>
                <ul id="cocktail-ingredients" class="list-disc list-inside text-gray-200 space-y-1"></ul>
            </div>

            <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-800">
                <h3 class="text-gray-400 text-sm font-semibold tracking-wider mb-2">調酒師的話</h3>
                <p id="flavor-metaphor" class="text-gray-300 leading-relaxed italic"></p>
            </div>

            <div class="pt-4 border-t border-gray-700">
                <p id="cheers-message" class="text-xl font-bold text-amber-500 text-center tracking-wide"></p>
            </div>

            <button onclick="resetBar()" class="mt-4 text-gray-500 hover:text-gray-300 underline text-sm text-center">
                返回吧台，重新點酒
            </button>
        </div>
    </div>

    <script>
        async function orderCocktail() {
            const moodInput = document.getElementById('mood-input').value.trim();
            if (!moodInput) {
                alert('請輸入你的心情或煩惱喔！');
                return;
            }

            // 切換 UI 至載入狀態
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');
            document.getElementById('loading-section').classList.add('flex');

            try {
                const response = await fetch('/api/mix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mood: moodInput })
                });

                if (!response.ok) throw new Error('API 請求失敗');

                const data = await response.json();

                // 填入資料
                document.getElementById('cocktail-name').textContent = data.cocktail_name;
                document.getElementById('flavor-metaphor').textContent = data.flavor_metaphor;
                document.getElementById('cheers-message').textContent = data.cheers_message;
                document.getElementById('cocktail-image').src = data.image_url;

                // 處理配方列表
                const ingredientsList = document.getElementById('cocktail-ingredients');
                ingredientsList.innerHTML = '';
                data.ingredients.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    ingredientsList.appendChild(li);
                });

                // 切換 UI 至結果狀態
                document.getElementById('loading-section').classList.remove('flex');
                document.getElementById('loading-section').classList.add('hidden');

                const resultSection = document.getElementById('result-section');
                resultSection.classList.remove('hidden');
                // 延遲一點點加上 opacity-100 達成淡入效果
                setTimeout(() => {
                    resultSection.classList.remove('opacity-0');
                    resultSection.classList.add('opacity-100');
                }, 100);

            } catch (error) {
                alert('調酒師不小心打翻酒了，請稍後再試一次！');
                resetBar();
            }
        }

        function resetBar() {
            document.getElementById('mood-input').value = '';
            document.getElementById('result-section').classList.add('opacity-0');

            setTimeout(() => {
                document.getElementById('result-section').classList.add('hidden');
                document.getElementById('result-section').classList.remove('opacity-100');
                document.getElementById('input-section').classList.remove('hidden');
            }, 500);
        }
    </script>
</body>

</html>
